# Local development only; tests start their own containers.
services:
  postgres:
    # Pinned to the major: uuidv7() needs 18, and minors arrive on pull.
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Loopback only, so the dev database is never reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    # Optional: a large Core, Sim and FEniCSx image.
    profiles: [engine]
    build:
      context: apps/engine
      target: dev
    command:
      [
        "uvicorn",
        "dtcc_engine.api:create_app_from_environment",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    environment:
      # Local development only: the port below is reachable from this machine alone.
      ENGINE_API_TOKEN: ${ENGINE_API_TOKEN:-local-dev-engine-token}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/engine:/app
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  engine-lock:
    # Regenerates the Engine's conda lock files: `pnpm engine:lock`.
    profiles: [engine-lock]
    image: condaforge/miniforge3:26.7.2-0
    working_dir: /engine
    command: ["sh", "lock.sh"]
    volumes:
      - ./apps/engine:/engine

  engine-prod:
    # Local check of the production target: `pnpm engine:check:prod`. No port is published.
    profiles: [engine-prod]
    build:
      context: apps/engine
      target: prod
    environment:
      ENGINE_API_TOKEN: local-prod-check-token

volumes:
  postgres-data:
