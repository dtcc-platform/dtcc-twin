# The frontend and its API on one origin, as in development, where Vite proxies /api. Plain HTTP on 8080: whatever
# terminates TLS in front of it sets HSTS.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # One past the backend's 3 MB JSON limit, so the backend, not nginx, answers an oversized body.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # A location with its own add_header drops the server's unless told to merge them.
    add_header_inherit merge;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3030;
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Job packages stream from disk; buffering would copy each into nginx's temp files first.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Vite puts a content hash in every file name under /assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all load index.html, which must never be cached past a release.
    location / {
        add_header Cache-Control no-cache;
        try_files $uri /index.html;
    }
}
